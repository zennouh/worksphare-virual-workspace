name: worksphare

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  ci:
    if: |
      contains(github.event.head_commit.message, 'DEPLOY')
    runs-on: ubuntu-latest
    steps:
      - name: clone project to runner
        uses: actions/checkout@v4

      - name: install node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install packages
        run: npm ci

      - name: test
        run: npm test


      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          if-no-files-found: error

      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Merge dev into main
        run: |
          git fetch origin
          git checkout -b main
          git pull origin main
          git merge origin/dev --allow-unrelated-histories --strategy-option=theirs -m "CI: Auto-merge dev into main (force theirs)"

  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/        

      - name: configure aws cred
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.REGION}}

      - name: Upload to S3
        run: aws s3 sync dist s3://${{secrets.BUCKET}} --delete

      - name: Create CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"        

